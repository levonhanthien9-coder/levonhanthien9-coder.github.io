<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Aqua Store Pro - Quản Lý Kho & Đơn Hàng</title>
    <style>
        :root { --primary: #00a8ff; --dark: #2f3640; --gold: #fbc531; --success: #4cd137; --danger: #e84118; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f6fa; margin: 0; padding-bottom: 50px; }
        nav { background: var(--dark); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .btn-auth { background: var(--primary); border: none; padding: 10px 20px; border-radius: 5px; color: white; cursor: pointer; font-weight: bold; }
        #user-info-bar { background: #dcdde1; padding: 10px 5%; display: none; text-align: right; border-bottom: 2px solid var(--primary); }
        .section-box { background: white; padding: 20px; margin: 20px 5%; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #admin-panel { background: #f1c40f; display: none; }
        #history-panel { display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: var(--dark); color: white; }
        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 20px 5%; }
        .fish-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; position: relative; }
        .fish-card img { width: 100%; height: 200px; object-fit: cover; }
        .stock-tag { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; padding: 5px 10px; border-radius: 20px; font-size: 12px; }
        .btn-buy { background: var(--dark); color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; margin-bottom: 15px; width: 80%; }
        .btn-buy:disabled { background: #ccc; cursor: not-allowed; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; }
        .modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 10px; width: 380px; max-height: 90vh; overflow-y: auto; }
        .modal input { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ddd; border-radius: 5px; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: white; }
    </style>
</head>
<body>

    <nav>
        <div style="font-size: 24px; font-weight: bold;">🐟 AQUA STORE PRO</div>
        <div id="auth-buttons">
            <button class="btn-auth" onclick="openModal('login-overlay')">ĐĂNG NHẬP</button>
            <button class="btn-auth" style="background:#487eb0" onclick="openModal('register-overlay')">ĐĂNG KÝ</button>
        </div>
    </nav>

    <div id="user-info-bar">
        Chào, <b id="display-name"></b> | Ví: <b id="display-balance" style="color:red">0</b>đ 
        <button onclick="logout()">Thoát</button>
    </div>

    <!-- ADMIN PANEL -->
    <div id="admin-panel" class="section-box">
        <h3>🛠 QUẢN TRỊ VIÊN: KHO HÀNG & TÀI CHÍNH</h3>
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <div style="flex: 1; border-right: 1px solid #999; padding-right: 10px;">
                <h4>Cộng tiền User</h4>
                <input type="text" id="target-user" placeholder="Tên User">
                <input type="number" id="add-amount" placeholder="Số tiền">
                <button onclick="adminAddMoney()" style="background:var(--dark); color:white; padding: 5px 15px;">Xác nhận</button>
            </div>
            <div style="flex: 1;">
                <h4>Cập nhật Kho hàng</h4>
                <select id="select-fish" style="padding: 5px;"></select>
                <input type="number" id="new-stock" placeholder="Số lượng mới" style="width: 100px;">
                <button onclick="updateStock()" style="background:var(--dark); color:white; padding: 5px 15px;">Cập nhật</button>
            </div>
        </div>
        <h4>Đơn hàng cần xử lý:</h4>
        <div id="admin-order-list"></div>
    </div>

    <div id="history-panel" class="section-box">
        <h3>📜 LỊCH SỬ ĐƠN HÀNG</h3>
        <div id="user-order-list"></div>
    </div>

    <div class="container" id="product-grid"></div>

    <!-- MODAL MUA HÀNG (MỚI) -->
    <div class="overlay" id="buy-overlay">
        <div class="modal">
            <h2 id="buy-title">XÁC NHẬN MUA</h2>
            <p id="buy-price-info"></p>
            <input type="number" id="order-qty" value="1" min="1" oninput="calculateTotal()">
            <input type="text" id="order-phone" placeholder="Số điện thoại">
            <input type="text" id="order-address" placeholder="Địa chỉ nhận hàng">
            <div style="background: #eee; padding: 10px; border-radius: 5px; margin: 10px 0;">
                Tổng thanh toán: <b id="buy-total" style="color:red">0đ</b>
            </div>
            <button onclick="confirmPurchase()" style="width:100%; padding:15px; background:var(--success); color:white; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">XÁC NHẬN ĐẶT HÀNG</button>
            <button onclick="closeModals()" style="background:none; border:none; color:gray; width:100%; margin-top:10px; cursor:pointer;">Hủy bỏ</button>
        </div>
    </div>

    <!-- MODAL ĐĂNG KÝ/ĐĂNG NHẬP (Giữ nguyên cũ) -->
    <div class="overlay" id="register-overlay"><div class="modal"><h2>ĐĂNG KÝ</h2><input type="text" id="reg-user" placeholder="Tên"><input type="password" id="reg-pass" placeholder="Mật khẩu"><input type="password" id="reg-confirm" placeholder="Xác nhận"><button onclick="handleRegister()" style="width:100%; padding:10px; background:var(--success); color:white; border:none;">TẠO TÀI KHOẢN</button><button onclick="closeModals()">Hủy</button></div></div>
    <div class="overlay" id="login-overlay"><div class="modal"><h2>ĐĂNG NHẬP</h2><input type="text" id="login-user" placeholder="Tên"><input type="password" id="login-pass" placeholder="Mật khẩu"><button onclick="handleLogin()" style="width:100%; padding:10px; background:var(--primary); color:white; border:none;">VÀO CỬA HÀNG</button><button onclick="closeModals()">Hủy</button></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getDatabase, ref, set, get, child, update, onValue } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA8Afsg5lU6hBZbhEFvjzSdS4mnoWfO-k4",
            authDomain: "shopcachaba.firebaseapp.com",
            projectId: "shopcachaba",
            storageBucket: "shopcachaba.firebasestorage.app",
            messagingSenderId: "822335531777",
            appId: "1:822335531777:web:057f0f90320e529e444900",
            measurementId: "G-L7CKV18DVJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentFishSelecting = null;

        // Khởi tạo kho hàng nếu chưa có (Chỉ chạy 1 lần)
        async function initStock() {
            const snapshot = await get(child(ref(db), 'fishes'));
            if (!snapshot.exists()) {
                const initialFishes = {
                    koi: { name: "Cá Koi Nhật", price: 1500000, stock: 10, img: "https://images.unsplash.com/photo-1517361225306-73723bad67d7?w=400" },
                    rong: { name: "Cá Rồng Huyết", price: 5000000, stock: 5, img: "https://images.unsplash.com/photo-1625244695851-1fc8739942b0?w=400" },
                    betta: { name: "Cá Betta", price: 200000, stock: 50, img: "https://images.unsplash.com/photo-1522060290919-28f7a4a19be1?w=400" }
                };
                set(ref(db, 'fishes'), initialFishes);
            }
        }

        window.openModal = (id) => { document.getElementById(id).style.display = 'block'; };
        window.closeModals = () => { 
            document.querySelectorAll('.overlay').forEach(o => o.style.display = 'none');
        };

        // --- MUA HÀNG MỚI ---
        window.buyFishTrigger = (key, name, price) => {
            const cur = localStorage.getItem('currentUser');
            if(!cur) return alert("Vui lòng đăng nhập!");
            currentFishSelecting = { key, name, price };
            document.getElementById('buy-title').innerText = "MUA " + name.toUpperCase();
            document.getElementById('buy-price-info').innerText = "Giá: " + price.toLocaleString() + "đ/con";
            document.getElementById('order-qty').value = 1;
            calculateTotal();
            openModal('buy-overlay');
        };

        window.calculateTotal = () => {
            const qty = document.getElementById('order-qty').value || 0;
            const total = qty * currentFishSelecting.price;
            document.getElementById('buy-total').innerText = total.toLocaleString() + "đ";
        };

        window.confirmPurchase = async () => {
            const qty = parseInt(document.getElementById('order-qty').value);
            const phone = document.getElementById('order-phone').value;
            const addr = document.getElementById('order-address').value;
            const cur = localStorage.getItem('currentUser');

            if(!phone || !addr || qty <= 0) return alert("Vui lòng nhập đầy đủ thông tin!");

            const userSnap = await get(child(ref(db), `users/${cur}`));
            const fishSnap = await get(child(ref(db), `fishes/${currentFishSelecting.key}`));
            
            const user = userSnap.val();
            const fish = fishSnap.val();
            const totalCost = qty * fish.price;

            if(fish.stock < qty) return alert("Kho không đủ cá!");
            if(user.balance < totalCost) return alert("Bạn không đủ tiền!");

            // Trừ tiền, trừ kho, tạo đơn
            await update(ref(db, `users/${cur}`), { balance: user.balance - totalCost });
            await update(ref(db, `fishes/${currentFishSelecting.key}`), { stock: fish.stock - qty });
            
            const orderId = Date.now();
            await set(ref(db, 'orders/' + orderId), {
                id: orderId, user: cur, product: fish.name, qty: qty, 
                price: totalCost, phone: phone, address: addr,
                status: 'Chờ xử lý', time: new Date().toLocaleString()
            });

            alert("Đặt hàng thành công!");
            closeModals();
        };

        // --- ADMIN FUNCTIONS ---
        window.updateStock = () => {
            const key = document.getElementById('select-fish').value;
            const qty = parseInt(document.getElementById('new-stock').value);
            update(ref(db, `fishes/${key}`), { stock: qty });
            alert("Đã cập nhật kho!");
        };

        window.adminAddMoney = async () => {
            const t = document.getElementById('target-user').value;
            const m = parseInt(document.getElementById('add-amount').value);
            const snapshot = await get(child(ref(db), `users/${t}`));
            if(snapshot.exists()) {
                update(ref(db, `users/${t}`), { balance: (snapshot.val().balance || 0) + m });
                alert("Đã cộng tiền!");
            } else alert("Không thấy user!");
        };

        window.updateStatus = (orderId, newStatus) => {
            update(ref(db, `orders/${orderId}`), { status: newStatus });
        };

        // --- APP LOGIC ---
        function initApp() {
            initStock();
            const cur = localStorage.getItem('currentUser');
            
            // Theo dõi Kho cá & Render sản phẩm
            onValue(ref(db, 'fishes'), (snapshot) => {
                const fishesData = snapshot.val();
                const grid = document.getElementById('product-grid');
                const selectFish = document.getElementById('select-fish');
                grid.innerHTML = '';
                selectFish.innerHTML = '';

                for(let key in fishesData) {
                    const f = fishesData[key];
                    // Render UI
                    grid.innerHTML += `
                        <div class="fish-card">
                            <span class="stock-tag">Kho: ${f.stock}</span>
                            <img src="${f.img}">
                            <h3>${f.name}</h3>
                            <p style="color:red; font-weight:bold">${f.price.toLocaleString()}đ</p>
                            <button class="btn-buy" ${f.stock <= 0 ? 'disabled' : ''} 
                                onclick="buyFishTrigger('${key}', '${f.name}', ${f.price})">
                                ${f.stock <= 0 ? 'HẾT HÀNG' : 'MUA NGAY'}
                            </button>
                        </div>`;
                    // Render Admin Select
                    selectFish.innerHTML += `<option value="${key}">${f.name}</option>`;
                }
            });

            if(!cur) return;

            // Theo dõi User Info
            onValue(ref(db, `users/${cur}`), (snapshot) => {
                const user = snapshot.val();
                if(!user) return;
                document.getElementById('auth-buttons').style.display = 'none';
                document.getElementById('user-info-bar').style.display = 'block';
                document.getElementById('display-name').innerText = cur;
                document.getElementById('display-balance').innerText = (user.balance || 0).toLocaleString();
                if(user.role === 'admin') document.getElementById('admin-panel').style.display = 'block';
            });

            // Theo dõi Orders
            onValue(ref(db, 'orders'), (snapshot) => {
                const orders = snapshot.val() || {};
                renderUserOrders(cur, orders);
                if(document.getElementById('admin-panel').style.display === 'block') renderAdminOrders(orders);
            });
        }

        function renderUserOrders(username, allOrders) {
            document.getElementById('history-panel').style.display = 'block';
            let html = `<table><tr><th>Sản phẩm</th><th>SL</th><th>Tổng</th><th>Trạng thái</th></tr>`;
            const myOrders = Object.values(allOrders).filter(o => o.user === username).reverse();
            myOrders.forEach(o => {
                html += `<tr><td>${o.product}</td><td>${o.qty}</td><td>${o.price.toLocaleString()}</td>
                <td><span class="status-badge" style="background:${getStatusColor(o.status)}">${o.status}</span></td></tr>`;
            });
            document.getElementById('user-order-list').innerHTML = html + `</table>`;
        }

        function renderAdminOrders(allOrders) {
            let html = `<table><tr><th>Khách</th><th>SĐT/Địa chỉ</th><th>Sản phẩm/SL</th><th>Thao tác</th></tr>`;
            Object.values(allOrders).reverse().forEach(o => {
                html += `<tr>
                    <td><b>${o.user}</b></td>
                    <td style="font-size:12px">${o.phone}<br>${o.address}</td>
                    <td>${o.product} (x${o.qty})</td>
                    <td>
                        <button onclick="updateStatus(${o.id}, 'Đang chuẩn bị')">Chuẩn bị</button>
                        <button onclick="updateStatus(${o.id}, 'Đang giao')">Giao</button>
                        <button onclick="updateStatus(${o.id}, 'Đã giao')">Xong</button>
                    </td></tr>`;
            });
            document.getElementById('admin-order-list').innerHTML = html + `</table>`;
        }

        function getStatusColor(s) {
            if(s === 'Đang chuẩn bị') return '#ff9f43';
            if(s === 'Đang giao') return '#0984e3';
            if(s === 'Đã giao') return '#4cd137';
            return '#7f8c8d';
        }

        // --- AUTH (Giữ nguyên cũ) ---
        window.handleRegister = async () => { /* code đăng ký cũ */ };
        window.handleLogin = async () => { /* code đăng nhập cũ */ };
        window.logout = () => { localStorage.removeItem('currentUser'); location.reload(); };

        initApp();
    </script>
</body>
</html>
