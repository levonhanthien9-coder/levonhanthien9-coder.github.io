<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>CÁ CẢNH STORE - Đỉnh Nóc Kịch Trần</title>
    <style>
        :root { 
            --primary: #00a8ff; --dark: #2f3640; --gold: #fbc531; 
            --success: #4cd137; --danger: #e84118; --light: #f5f6fa; --white: #ffffff;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); margin: 0; }
        nav { background: var(--dark); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 24px; font-weight: bold; color: var(--gold); cursor: pointer; }
        .menu a { color: white; text-decoration: none; margin-left: 20px; cursor: pointer; font-weight: 500; }
        
        /* BOXES */
        .section-box { background: var(--white); padding: 25px; margin: 20px 5%; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .section-title { border-left: 5px solid var(--primary); padding-left: 15px; margin-bottom: 20px; }

        /* TABLES */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; font-size: 14px; }
        th { background: #f8f9fa; }

        /* GRID */
        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 20px 5%; }
        .fish-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; padding-bottom: 15px; }
        .fish-card img { width: 100%; height: 180px; object-fit: cover; }

        /* MODALS */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; }
        .modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 10px; width: 350px; max-height: 85vh; overflow-y: auto; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; color: white; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="showPage('main')">🐟 CÁ CẢNH STORE</div>
        <div class="menu">
            <a onclick="showPage('main')">Trang Chủ</a>
            <a onclick="showPage('history')" id="menu-history" style="display:none">Lịch Sử</a>
            <a onclick="showPage('admin')" id="menu-admin" style="display:none; color:var(--gold)">QUẢN TRỊ</a>
            <button id="btn-login" class="btn" style="background:var(--primary); margin-left:15px" onclick="openModal('login-overlay')">Đăng Nhập</button>
        </div>
        <div id="user-info" style="display:none; color:white; margin-left:20px">
            <span id="display-name"></span> | <span id="display-balance" style="color:var(--success)">0</span>đ
            <button onclick="logout()" style="background:none; border:1px solid #666; color:white; cursor:pointer; margin-left:10px">Thoát</button>
        </div>
    </nav>

    <div id="main-content">
        <div style="height:300px; background:linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1524704654690-b56c05c78a00?w=1200'); background-size:cover; display:flex; flex-direction:column; justify-content:center; align-items:center; color:white; text-align:center;">
            <h1 style="font-size:3rem">ĐỈNH NÓC KỊCH TRẦN</h1>
        </div>
        <div class="container" id="product-list"></div>
    </div>

    <div id="history-page" style="display:none" class="section-box">
        <h2 class="section-title">📜 LỊCH SỬ MUA HÀNG</h2>
        <div id="user-order-list"></div>
    </div>

    <!-- TRANG QUẢN TRỊ -->
    <div id="admin-page" style="display:none">
        <div class="section-box">
            <h2 class="section-title">👥 QUẢN LÝ NGƯỜI DÙNG & TIỀN</h2>
            <table>
                <thead><tr><th>Tài khoản</th><th>Số dư</th><th>Cộng/Trừ tiền</th></tr></thead>
                <tbody id="admin-user-list"></tbody>
            </table>
        </div>

        <div class="section-box">
            <h2 class="section-title">📦 QUẢN LÝ ĐƠN HÀNG</h2>
            <div style="overflow-x:auto">
                <table>
                    <thead><tr><th>Khách</th><th>Sản phẩm</th><th>Địa chỉ</th><th>Tổng tiền</th><th>Trạng thái</th></tr></thead>
                    <tbody id="admin-order-list"></tbody>
                </table>
            </div>
        </div>

        <div class="section-box">
            <h2 class="section-title">🐟 QUẢN LÝ KHO CÁ</h2>
            <table>
                <thead><tr><th>Tên cá</th><th>Số lượng trong kho</th><th>Cập nhật</th></tr></thead>
                <tbody id="admin-fish-list"></tbody>
            </table>
        </div>
    </div>

    <!-- MODAL MUA HÀNG -->
    <div class="overlay" id="buy-overlay">
        <div class="modal">
            <h3 id="buy-name"></h3>
            <p id="buy-price"></p>
            <hr>
            <input type="number" id="buy-qty" value="1" min="1" oninput="updateTotal()">
            <input type="text" id="cust-name" placeholder="Tên người nhận">
            <input type="text" id="cust-phone" placeholder="Số điện thoại">
            <input type="text" id="cust-addr" placeholder="Địa chỉ giao hàng">
            <p>Tổng: <b id="buy-total" style="color:var(--danger)">0đ</b></p>
            <button class="btn" style="background:var(--success); width:100%" onclick="confirmBuy()">XÁC NHẬN ĐẶT HÀNG</button>
            <button class="btn" style="background:none; color:#666; width:100%" onclick="closeModals()">Hủy</button>
        </div>
    </div>

    <!-- MODAL ĐĂNG NHẬP -->
    <div class="overlay" id="login-overlay">
        <div class="modal">
            <h2>Đăng Nhập</h2>
            <input type="text" id="log-u" placeholder="Tên tài khoản">
            <input type="password" id="log-p" placeholder="Mật khẩu">
            <button class="btn" style="background:var(--primary); width:100%" onclick="handleLogin()">Vào Cửa Hàng</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getDatabase, ref, set, get, child, update, onValue } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA8Afsg5lU6hBZbhEFvjzSdS4mnoWfO-k4",
            authDomain: "shopcachaba.firebaseapp.com",
            projectId: "shopcachaba",
            storageBucket: "shopcachaba.firebasestorage.app",
            messagingSenderId: "822335531777",
            appId: "1:822335531777:web:057f0f90320e529e444900"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let selectedFish = null;
        const cur = localStorage.getItem('currentUser');

        window.showPage = (p) => {
            document.getElementById('main-content').style.display = p==='main'?'block':'none';
            document.getElementById('history-page').style.display = p==='history'?'block':'none';
            document.getElementById('admin-page').style.display = p==='admin'?'block':'none';
        };
        window.openModal = (id) => document.getElementById(id).style.display = 'block';
        window.closeModals = () => document.querySelectorAll('.overlay').forEach(o => o.style.display = 'none');

        // ĐĂNG NHẬP
        window.handleLogin = async () => {
            const u = document.getElementById('log-u').value;
            const p = document.getElementById('log-p').value;
            const s = await get(child(ref(db), `users/${u}`));
            if(s.exists() && s.val().pass === p) { localStorage.setItem('currentUser', u); location.reload(); }
            else alert("Sai tài khoản!");
        };
        window.logout = () => { localStorage.removeItem('currentUser'); location.reload(); };

        // MUA HÀNG
        window.buyClick = (k, n, p) => {
            if(!cur) return alert("Hãy đăng nhập!");
            selectedFish = { k, n, p };
            document.getElementById('buy-name').innerText = n;
            document.getElementById('buy-price').innerText = "Giá: " + p.toLocaleString() + "đ";
            updateTotal();
            openModal('buy-overlay');
        };
        window.updateTotal = () => {
            const q = document.getElementById('buy-qty').value;
            document.getElementById('buy-total').innerText = (q * selectedFish.p).toLocaleString() + "đ";
        };
        window.confirmBuy = async () => {
            const q = parseInt(document.getElementById('buy-qty').value);
            const n = document.getElementById('cust-name').value;
            const ph = document.getElementById('cust-phone').value;
            const ad = document.getElementById('cust-addr').value;
            if(!n || !ph || !ad) return alert("Nhập đủ thông tin giao hàng!");

            const uSnap = await get(child(ref(db), `users/${cur}`));
            const fSnap = await get(child(ref(db), `fishes/${selectedFish.k}`));
            const total = q * selectedFish.p;

            if(uSnap.val().balance < total) return alert("Ví không đủ tiền!");
            if(fSnap.val().stock < q) return alert("Kho không đủ cá!");

            await update(ref(db, `users/${cur}`), { balance: uSnap.val().balance - total });
            await update(ref(db, `fishes/${selectedFish.k}`), { stock: fSnap.val().stock - q });
            const id = "ORD" + Date.now();
            await set(ref(db, 'orders/'+id), { id, user: cur, receiver: n, phone: ph, address: ad, product: selectedFish.n, qty: q, price: total, status: 'Đang chuẩn bị', time: new Date().toLocaleString() });
            alert("Đặt thành công!"); location.reload();
        };

        // ADMIN FUNCTIONS
        window.adminAddMoney = async (user) => {
            const amt = parseInt(document.getElementById('amt-'+user).value);
            const s = await get(child(ref(db), `users/${user}`));
            await update(ref(db, `users/${user}`), { balance: (s.val().balance || 0) + amt });
            alert("Đã cập nhật tiền!");
        };
        window.adminUpdateStock = async (k) => {
            const s = parseInt(document.getElementById('stock-'+k).value);
            await update(ref(db, `fishes/${k}`), { stock: s });
            alert("Đã cập nhật kho!");
        };
        window.adminUpdateStatus = async (id, st) => {
            await update(ref(db, `orders/${id}`), { status: st });
        };

        // LOAD DATA
        onValue(ref(db, 'fishes'), (snap) => {
            const list = document.getElementById('product-list');
            const adminFish = document.getElementById('admin-fish-list');
            list.innerHTML = ''; adminFish.innerHTML = '';
            for(let k in snap.val()){
                const f = snap.val()[k];
                list.innerHTML += `<div class="fish-card"><img src="${f.img}"><h3>${f.name}</h3><p style="color:red;font-weight:bold">${f.price.toLocaleString()}đ</p><p>Kho: ${f.stock}</p><button class="btn" style="background:var(--primary)" onclick="buyClick('${k}','${f.name}',${f.price})">MUA NGAY</button></div>`;
                adminFish.innerHTML += `<tr><td>${f.name}</td><td><input type="number" id="stock-${k}" value="${f.stock}" style="width:80px"></td><td><button onclick="adminUpdateStock('${k}')" class="btn" style="background:var(--primary);padding:5px">Lưu</button></td></tr>`;
            }
        });

        if(cur){
            document.getElementById('btn-login').style.display = 'none';
            document.getElementById('user-info').style.display = 'block';
            document.getElementById('display-name').innerText = cur;
            document.getElementById('menu-history').style.display = 'block';
            onValue(ref(db, `users/${cur}`), s => {
                document.getElementById('display-balance').innerText = (s.val().balance || 0).toLocaleString();
                if(s.val().role === 'admin'){
                    document.getElementById('menu-admin').style.display = 'block';
                    loadAdmin();
                }
            });
            onValue(ref(db, 'orders'), s => {
                let h = '<table><tr><th>Ngày</th><th>Cá</th><th>Tổng</th><th>Trạng thái</th></tr>';
                Object.values(s.val()||{}).filter(o=>o.user===cur).reverse().forEach(o=>{
                    h += `<tr><td>${o.time}</td><td>${o.product}</td><td>${o.price.toLocaleString()}</td><td>${o.status}</td></tr>`;
                });
                document.getElementById('user-order-list').innerHTML = h + '</table>';
            });
        }

        function loadAdmin(){
            onValue(ref(db, 'users'), s => {
                let h = '';
                for(let n in s.val()){
                    h += `<tr><td>${n}</td><td>${(s.val()[n].balance||0).toLocaleString()}</td><td><input type="number" id="amt-${n}" style="width:100px;margin:0" placeholder="Số tiền"> <button onclick="adminAddMoney('${n}')" class="btn" style="background:var(--success);padding:5px">OK</button></td></tr>`;
                }
                document.getElementById('admin-user-list').innerHTML = h;
            });
            onValue(ref(db, 'orders'), s => {
                let h = '';
                Object.values(s.val()||{}).reverse().forEach(o=>{
                    h += `<tr><td>${o.user}</td><td>${o.product} (x${o.qty})</td><td>${o.receiver}<br>${o.phone}<br>${o.address}</td><td>${o.price.toLocaleString()}</td><td>
                        <select onchange="adminUpdateStatus('${o.id}', this.value)">
                            <option ${o.status=='Đang chuẩn bị'?'selected':''}>Đang chuẩn bị</option>
                            <option ${o.status=='Đang giao'?'selected':''}>Đang giao</option>
                            <option ${o.status=='Đã giao'?'selected':''}>Đã giao</option>
                            <option ${o.status=='Hủy'?'selected':''}>Hủy</option>
                        </select>
                    </td></tr>`;
                });
                document.getElementById('admin-order-list').innerHTML = h;
            });
        }
    </script>
</body>
</html>
