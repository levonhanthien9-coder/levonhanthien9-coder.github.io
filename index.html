<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tech Shop Pro</title>
    <style>
        /* CSS Giao diện */
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; }
        .modal { 
            display: none; /* Mặc định ẩn */
            position: fixed; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            background: white; padding: 2rem; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5); z-index: 1000;
            border-radius: 10px;
        }
        .overlay {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 999;
        }
        nav { background: #222; color: white; padding: 1rem; display: flex; justify-content: space-between; }
        button { cursor: pointer; padding: 8px 15px; }
        #admin-panel { background: #ffd32a; padding: 20px; display: none; margin: 20px; border-radius: 8px; }
    </style>
</head>
<body>

    <nav>
        <div style="font-size: 1.5rem; font-weight: bold;">MY STORE</div>
        <div id="auth-buttons">
            <button onclick="openLogin()">Đăng nhập / Đăng ký</button>
        </div>
        <div id="user-info" style="display: none;">
            Chào <span id="user-name"></span> | Ví: <span id="user-balance">0</span>đ
            <button onclick="logout()">Thoát</button>
        </div>
    </nav>

    <!-- Khu vực Admin -->
    <div id="admin-panel">
        <h3>Hệ thống Admin (Cộng/Trừ tiền)</h3>
        <input type="text" id="target-user" placeholder="Tên User">
        <input type="number" id="amount" placeholder="Số tiền (Vd: 50000)">
        <button onclick="adminAdjustMoney()">Xác nhận</button>
    </div>

    <!-- Modal và Overlay -->
    <div id="overlay" class="overlay" onclick="closeLogin()"></div>
    <div id="login-modal" class="modal">
        <h2>Đăng nhập hệ thống</h2>
        <input type="text" id="username" placeholder="Tên tài khoản" style="display:block; width:100%; margin-bottom:10px; padding:10px;">
        <input type="password" id="password" placeholder="Mật khẩu" style="display:block; width:100%; margin-bottom:10px; padding:10px;">
        <button onclick="handleLogin()" style="width:100%; background: #05c46b; color:white; border:none;">Vào ngay</button>
        <p style="font-size: 12px; color: #666;">*Admin: admin | MK: 123</p>
    </div>

    <script>
        // 1. Khởi tạo Admin mặc định
        if (!localStorage.getItem('user_admin')) {
            localStorage.setItem('user_admin', JSON.stringify({ name: 'Admin', pass: '123', balance: 1000000, role: 'admin' }));
        }

        // 2. Các hàm đóng mở Modal
        function openLogin() {
            document.getElementById('login-modal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }

        function closeLogin() {
            document.getElementById('login-modal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }

        // 3. Xử lý Đăng nhập
        function handleLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            if(!u || !p) return alert("Vui lòng nhập đủ!");

            let userData = localStorage.getItem('user_' + u);

            if (userData) {
                let user = JSON.parse(userData);
                if (user.pass === p) {
                    loginSuccess(u, user);
                } else {
                    alert("Sai mật khẩu!");
                }
            } else {
                // Tự đăng ký nếu user chưa tồn tại
                let newUser = { name: u, pass: p, balance: 0, role: 'user' };
                localStorage.setItem('user_' + u, JSON.stringify(newUser));
                loginSuccess(u, newUser);
                alert("Đã tạo tài khoản mới!");
            }
        }

        function loginSuccess(username, data) {
            localStorage.setItem('currentUser', username);
            closeLogin();
            renderUI();
        }

        function renderUI() {
            const currentUN = localStorage.getItem('currentUser');
            if (currentUN) {
                const data = JSON.parse(localStorage.getItem('user_' + currentUN));
                document.getElementById('auth-buttons').style.display = 'none';
                document.getElementById('user-info').style.display = 'block';
                document.getElementById('user-name').innerText = currentUN;
                document.getElementById('user-balance').innerText = data.balance.toLocaleString();

                if (data.role === 'admin') {
                    document.getElementById('admin-panel').style.display = 'block';
                }
            }
        }

        // 4. Admin Cộng tiền
        function adminAdjustMoney() {
            const target = document.getElementById('target-user').value;
            const cash = parseInt(document.getElementById('amount').value);
            const targetData = localStorage.getItem('user_' + target);

            if (targetData) {
                let user = JSON.parse(targetData);
                user.balance += cash;
                localStorage.setItem('user_' + target, JSON.stringify(user));
                alert("Thành công! Số dư mới của " + target + " là: " + user.balance);
                renderUI(); // Cập nhật lại màn hình
            } else {
                alert("Không tìm thấy User này!");
            }
        }

        function logout() {
            localStorage.removeItem('currentUser');
            location.reload();
        }

        // Chạy kiểm tra khi vừa load trang
        renderUI();
    </script>
</body>
</html>
