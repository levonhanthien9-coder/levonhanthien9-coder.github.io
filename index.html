<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>CÁ CẢNH STORE - Nâng Tầm Không Gian Sống</title>
    <style>
        /* --- CSS GỐC VÀ CÁC THÀNH PHẦN MỚI --- */
        :root { 
            --primary: #00a8ff; 
            --dark: #2f3640; 
            --gold: #fbc531; 
            --success: #4cd137; 
            --danger: #e84118; 
        }

        html {
            scroll-behavior: smooth; /* Cuộn trang mượt mà */
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #f5f6fa; 
            margin: 0; 
            padding-bottom: 50px; 
        }

        /* NAVIGATION */
        nav { 
            background: var(--dark); 
            color: white; 
            padding: 15px 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
        }

        .menu {
            display: flex;
            gap: 25px;
        }

        .menu a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }

        .menu a:hover {
            color: var(--primary);
        }

        .btn-auth { 
            background: var(--primary); 
            border: none; 
            padding: 10px 20px; 
            border-radius: 5px; 
            color: white; 
            cursor: pointer; 
            font-weight: bold; 
        }

        /* HERO SECTION (SLOGAN) */
        .hero-section {
            height: 450px;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1524704654690-b56c05c78a00?w=1200');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .hero-section h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            color: var(--gold);
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .btn-hero {
            background: var(--primary);
            color: white;
            padding: 15px 45px;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,168,255,0.4);
        }

        .btn-hero:hover {
            transform: scale(1.05);
            background: #008cd4;
        }

        /* CÁC PHẦN CŨ */
        #user-info-bar { background: #dcdde1; padding: 10px 5%; display: none; text-align: right; border-bottom: 2px solid var(--primary); }
        .section-box { background: white; padding: 20px; margin: 20px 5%; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #admin-panel { background: #f1c40f; display: none; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: var(--dark); color: white; }
        
        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 40px 5%; }
        .fish-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; position: relative; transition: 0.3s; }
        .fish-card:hover { transform: translateY(-5px); }
        .fish-card img { width: 100%; height: 200px; object-fit: cover; }
        
        .stock-tag { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; padding: 5px 10px; border-radius: 20px; font-size: 12px; }
        .btn-buy { background: var(--dark); color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; margin-bottom: 15px; width: 80%; font-weight: bold; }
        
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; }
        .modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 10px; width: 380px; max-height: 90vh; overflow-y: auto; }
        .modal input { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ddd; border-radius: 5px; }
    </style>
</head>
<body>

    <!-- NAVIGATION -->
    <nav id="home-top">
        <div style="font-size: 24px; font-weight: bold;">🐟 CÁ CẢNH STORE</div>
        
        <div class="menu">
            <a href="#home-top">Trang Chủ</a>
            <a href="#" onclick="alert('Chúng tôi cung cấp các dòng cá cảnh chất lượng nhất!')">Giới Thiệu</a>
            <a href="#product-grid">Sản Phẩm</a>
        </div>

        <div id="auth-buttons">
            <button class="btn-auth" onclick="openModal('login-overlay')">ĐĂNG NHẬP</button>
            <button class="btn-auth" style="background:#487eb0" onclick="openModal('register-overlay')">ĐĂNG KÝ</button>
        </div>
    </nav>

    <div id="user-info-bar">
        Chào, <b id="display-name"></b> | Ví: <b id="display-balance" style="color:red">0</b>đ 
        <button onclick="logout()">Thoát</button>
    </div>

    <!-- HERO SECTION -->
    <section class="hero-section">
        <h1>ĐAM MÊ TRONG TỪNG ÁNH MẮT</h1>
        <p style="font-size: 1.2rem; margin-bottom: 30px; opacity: 0.9;">Hệ thống cung cấp cá cảnh phong thủy hàng đầu</p>
        <a href="#product-grid" class="btn-hero">MUA NGAY</a>
    </section>

    <!-- ADMIN PANEL -->
    <div id="admin-panel" class="section-box">
        <h3>🛠 QUẢN TRỊ VIÊN</h3>
        <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 200px; border-right: 1px solid #999; padding-right: 10px;">
                <h4>Cộng tiền User</h4>
                <input type="text" id="target-user" placeholder="Tên User">
                <input type="number" id="add-amount" placeholder="Số tiền">
                <button onclick="adminAddMoney()" style="background:var(--dark); color:white; padding: 10px; width:100%;">CỘNG TIỀN</button>
            </div>
            <div style="flex: 1; min-width: 200px;">
                <h4>Nhập kho cá</h4>
                <select id="select-fish" style="width:100%; padding: 10px; margin-bottom: 8px;"></select>
                <input type="number" id="new-stock" placeholder="Số lượng mới">
                <button onclick="updateStock()" style="background:var(--dark); color:white; padding: 10px; width:100%;">CẬP NHẬT KHO</button>
            </div>
        </div>
        <h4>Đơn hàng hệ thống:</h4>
        <div id="admin-order-list" style="overflow-x: auto;"></div>
    </div>

    <div id="history-panel" class="section-box" style="display: none;">
        <h3>📜 LỊCH SỬ ĐƠN HÀNG</h3>
        <div id="user-order-list" style="overflow-x: auto;"></div>
    </div>

    <!-- PRODUCT GRID -->
    <h2 style="text-align: center; margin-top: 50px;" id="product-grid">DANH SÁCH SẢN PHẨM</h2>
    <div class="container" id="product-list"></div>

    <!-- MODALS (Giữ nguyên như code cũ) -->
    <div class="overlay" id="register-overlay">
        <div class="modal">
            <h2>ĐĂNG KÝ</h2>
            <input type="text" id="reg-user" placeholder="Tên tài khoản">
            <input type="password" id="reg-pass" placeholder="Mật khẩu">
            <input type="password" id="reg-confirm" placeholder="Xác nhận mật khẩu">
            <button onclick="handleRegister()" style="width:100%; padding:10px; background:var(--success); color:white; border:none; cursor:pointer;">TẠO TÀI KHOẢN</button>
            <button onclick="closeModals()" style="background:none; border:none; color:gray; width:100%; margin-top:10px; cursor:pointer;">Hủy</button>
        </div>
    </div>

    <div class="overlay" id="login-overlay">
        <div class="modal">
            <h2>ĐĂNG NHẬP</h2>
            <input type="text" id="login-user" placeholder="Tên tài khoản">
            <input type="password" id="login-pass" placeholder="Mật khẩu">
            <button onclick="handleLogin()" style="width:100%; padding:10px; background:var(--primary); color:white; border:none; cursor:pointer;">VÀO CỬA HÀNG</button>
            <button onclick="closeModals()" style="background:none; border:none; color:gray; width:100%; margin-top:10px; cursor:pointer;">Hủy</button>
        </div>
    </div>

    <div class="overlay" id="buy-overlay">
        <div class="modal">
            <h2 id="buy-title">XÁC NHẬN MUA</h2>
            <p id="buy-price-info"></p>
            <label>Số lượng:</label>
            <input type="number" id="order-qty" value="1" min="1" oninput="calculateTotal()">
            <input type="text" id="order-phone" placeholder="Số điện thoại">
            <input type="text" id="order-address" placeholder="Địa chỉ nhận hàng">
            <div style="background: #eee; padding: 10px; border-radius: 5px; margin: 10px 0;">
                Tổng: <b id="buy-total" style="color:red">0đ</b>
            </div>
            <button onclick="confirmPurchase()" style="width:100%; padding:15px; background:var(--success); color:white; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">ĐẶT HÀNG NGAY</button>
            <button onclick="closeModals()" style="background:none; border:none; color:gray; width:100%; margin-top:10px; cursor:pointer;">Hủy</button>
        </div>
    </div>

    <!-- FIREBASE LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getDatabase, ref, set, get, child, update, onValue } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA8Afsg5lU6hBZbhEFvjzSdS4mnoWfO-k4",
            authDomain: "shopcachaba.firebaseapp.com",
            projectId: "shopcachaba",
            storageBucket: "shopcachaba.firebasestorage.app",
            messagingSenderId: "822335531777",
            appId: "1:822335531777:web:057f0f90320e529e444900",
            measurementId: "G-L7CKV18DVJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let currentFishSelecting = null;

        window.openModal = (id) => { document.getElementById(id).style.display = 'block'; };
        window.closeModals = () => { document.querySelectorAll('.overlay').forEach(o => o.style.display = 'none'); };

        // AUTH & LOGIC (GIỮ NGUYÊN)
        window.handleRegister = async () => {
            const u = document.getElementById('reg-user').value.trim();
            const p = document.getElementById('reg-pass').value;
            const c = document.getElementById('reg-confirm').value;
            if(!u || !p) return alert("Vui lòng nhập tên và mật khẩu!");
            if(p !== c) return alert("Mật khẩu không khớp!");
            const snapshot = await get(child(ref(db), `users/${u}`));
            if (snapshot.exists()) return alert("Tài khoản đã tồn tại!");
            await set(ref(db, 'users/' + u), { name: u, pass: p, balance: 0, role: u === 'admin' ? 'admin' : 'user' });
            alert("Đăng ký thành công!");
            closeModals();
        };

        window.handleLogin = async () => {
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value;
            const snapshot = await get(child(ref(db), `users/${u}`));
            if (snapshot.exists()) {
                if(snapshot.val().pass === p) {
                    localStorage.setItem('currentUser', u);
                    location.reload();
                } else alert("Sai mật khẩu!");
            } else alert("Tài khoản không tồn tại!");
        };

        window.logout = () => { localStorage.removeItem('currentUser'); location.reload(); };

        // KHO HÀNG
        async function initStock() {
            const snap = await get(child(ref(db), 'fishes'));
            if (!snap.exists()) {
                set(ref(db, 'fishes'), {
                    koi: { name: "Cá Koi Nhật", price: 1500000, stock: 10, img: "https://images.unsplash.com/photo-1517361225306-73723bad67d7?w=400" },
                    rong: { name: "Cá Rồng Huyết Hán", price: 5000000, stock: 5, img: "https://images.unsplash.com/photo-1625244695851-1fc8739942b0?w=400" },
                    betta: { name: "Cá Betta Galaxy", price: 200000, stock: 50, img: "https://images.unsplash.com/photo-1522060290919-28f7a4a19be1?w=400" }
                });
            }
        }

        window.buyFishTrigger = (key, name, price) => {
            const cur = localStorage.getItem('currentUser');
            if(!cur) return alert("Hãy đăng nhập trước!");
            currentFishSelecting = { key, name, price };
            document.getElementById('buy-title').innerText = "MUA " + name;
            document.getElementById('buy-price-info').innerText = "Đơn giá: " + price.toLocaleString() + "đ";
            calculateTotal();
            openModal('buy-overlay');
        };

        window.calculateTotal = () => {
            const qty = parseInt(document.getElementById('order-qty').value) || 0;
            document.getElementById('buy-total').innerText = (qty * currentFishSelecting.price).toLocaleString() + "đ";
        };

        window.confirmPurchase = async () => {
            const qty = parseInt(document.getElementById('order-qty').value);
            const phone = document.getElementById('order-phone').value.trim();
            const addr = document.getElementById('order-address').value.trim();
            const cur = localStorage.getItem('currentUser');
            if(!phone || !addr || qty <= 0) return alert("Vui lòng nhập đủ thông tin!");
            const userSnap = await get(child(ref(db), `users/${cur}`));
            const fishSnap = await get(child(ref(db), `fishes/${currentFishSelecting.key}`));
            const user = userSnap.val();
            const fish = fishSnap.val();
            const total = qty * fish.price;
            if(fish.stock < qty) return alert("Trong kho chỉ còn " + fish.stock + " con!");
            if(user.balance < total) return alert("Bạn không đủ tiền!");
            await update(ref(db, `users/${cur}`), { balance: user.balance - total });
            await update(ref(db, `fishes/${currentFishSelecting.key}`), { stock: fish.stock - qty });
            const id = Date.now();
            await set(ref(db, 'orders/' + id), { id, user: cur, product: fish.name, qty, price: total, phone, address: addr, status: 'Chờ xử lý', time: new Date().toLocaleString() });
            alert("Đã đặt hàng!");
            closeModals();
        };

        window.adminAddMoney = async () => {
            const t = document.getElementById('target-user').value.trim();
            const m = parseInt(document.getElementById('add-amount').value);
            const snap = await get(child(ref(db), `users/${t}`));
            if(snap.exists()) {
                update(ref(db, `users/${t}`), { balance: (snap.val().balance || 0) + m });
                alert("Đã cộng tiền!");
            } else alert("User không tồn tại!");
        };

        window.updateStock = () => {
            const key = document.getElementById('select-fish').value;
            const qty = parseInt(document.getElementById('new-stock').value);
            update(ref(db, `fishes/${key}`), { stock: qty });
            alert("Đã cập nhật!");
        };

        window.updateStatus = (id, st) => { update(ref(db, `orders/${id}`), { status: st }); };

        // INIT UI
        function initApp() {
            initStock();
            const cur = localStorage.getItem('currentUser');

            onValue(ref(db, 'fishes'), (snap) => {
                const data = snap.val();
                const grid = document.getElementById('product-list');
                const sel = document.getElementById('select-fish');
                grid.innerHTML = ''; sel.innerHTML = '';
                for(let k in data) {
                    const f = data[k];
                    grid.innerHTML += `<div class="fish-card">
                        <span class="stock-tag">Kho: ${f.stock}</span>
                        <img src="${f.img}"><h3>${f.name}</h3>
                        <p style="color:red; font-weight:bold">${f.price.toLocaleString()}đ</p>
                        <button class="btn-buy" ${f.stock <= 0 ? 'disabled' : ''} onclick="buyFishTrigger('${k}','${f.name}',${f.price})">
                            ${f.stock <= 0 ? 'HẾT HÀNG' : 'MUA NGAY'}
                        </button>
                    </div>`;
                    sel.innerHTML += `<option value="${k}">${f.name}</option>`;
                }
            });

            if(!cur) return;

            onValue(ref(db, `users/${cur}`), (snap) => {
                const u = snap.val();
                if(!u) return;
                document.getElementById('auth-buttons').style.display = 'none';
                document.getElementById('user-info-bar').style.display = 'block';
                document.getElementById('display-name').innerText = cur;
                document.getElementById('display-balance').innerText = (u.balance || 0).toLocaleString();
                if(u.role === 'admin') document.getElementById('admin-panel').style.display = 'block';
            });

            onValue(ref(db, 'orders'), (snap) => {
                const data = snap.val() || {};
                const orders = Object.values(data).reverse();
                let uH = `<table><tr><th>Cá</th><th>SL</th><th>Tổng</th><th>Trạng thái</th></tr>`;
                orders.filter(o => o.user === cur).forEach(o => {
                    uH += `<tr><td>${o.product}</td><td>${o.qty}</td><td>${o.price.toLocaleString()}</td><td>${o.status}</td></tr>`;
                });
                document.getElementById('user-order-list').innerHTML = uH + `</table>`;
                document.getElementById('history-panel').style.display = 'block';

                let aH = `<table><tr><th>Khách</th><th>Thông tin</th><th>Đơn</th><th>Thao tác</th></tr>`;
                orders.forEach(o => {
                    aH += `<tr><td>${o.user}</td><td style="font-size:11px">${o.phone}<br>${o.address}</td><td>${o.product} x${o.qty}</td>
                    <td><button onclick="updateStatus(${o.id},'Đang giao')">Giao</button><button onclick="updateStatus(${o.id},'Xong')">Xong</button></td></tr>`;
                });
                document.getElementById('admin-order-list').innerHTML = aH + `</table>`;
            });
        }
        initApp();
    </script>
</body>
</html>
