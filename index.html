<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa Hàng Xịn Xò</title>
    <style>
        :root { --primary: #00d2d3; --dark: #222f3e; --danger: #ee5253; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f6fa; margin: 0; }
        
        /* Navbar */
        nav { background: var(--dark); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: bold; color: var(--primary); }
        .auth-zone button { background: var(--primary); border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }

        /* User Info Bar */
        #user-bar { background: #fff; padding: 10px 5%; display: none; border-bottom: 2px solid var(--primary); text-align: right; }

        /* Admin Panel */
        #admin-panel { display: none; background: #ff9f43; padding: 20px; margin: 20px 5%; border-radius: 10px; }

        /* Product Grid */
        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 40px 5%; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; }
        .card h3 { margin: 10px 0; }
        .btn-buy { background: var(--dark); color: white; border: none; width: 100%; padding: 10px; border-radius: 5px; cursor: pointer; }
        .btn-buy:hover { background: var(--danger); }

        /* Modal Đăng nhập */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; }
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 10px; width: 300px; text-align: center; }
        .modal input { width: 90%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">TECH STORE</div>
        <div class="auth-zone" id="auth-btns">
            <button onclick="toggleModal(true)">Đăng Nhập / Đăng Ký</button>
        </div>
    </nav>

    <div id="user-bar">
        Chào <b id="u-name"></b> | Ví: <b id="u-balance" style="color:red">0</b>đ 
        <button onclick="logout()" style="margin-left: 15px;">Thoát</button>
    </div>

    <div id="admin-panel">
        <h3>Quản trị viên: Cộng tiền</h3>
        <input type="text" id="target-user" placeholder="Tên User cần cộng">
        <input type="number" id="amount" placeholder="Số tiền">
        <button onclick="adminAddMoney()">Xác Nhận</button>
    </div>

    <div class="container" id="product-list">
        <!-- Sản phẩm hiện ở đây -->
    </div>

    <!-- Modal Login -->
    <div class="overlay" id="login-overlay">
        <div class="modal">
            <h2>ĐĂNG NHẬP</h2>
            <input type="text" id="username" placeholder="Tên tài khoản">
            <input type="password" id="password" placeholder="Mật khẩu">
            <button onclick="login()" style="width:100%; padding:10px; background:var(--primary); border:none; color:white; font-weight:bold;">VÀO CỬA HÀNG</button>
            <p style="font-size: 11px; margin-top: 10px;">Gợi ý: admin / 123</p>
            <button onclick="toggleModal(false)" style="background:none; border:none; color:blue; cursor:pointer; margin-top:10px;">Bỏ qua</button>
        </div>
    </div>

    <script>
        // Dữ liệu sản phẩm
        const products = [
            { id: 1, name: "Chuột Gaming", price: 500000, img: "https://via.placeholder.com/200" },
            { id: 2, name: "Bàn phím Cơ", price: 1200000, img: "https://via.placeholder.com/200" },
            { id: 3, name: "Tai nghe RGB", price: 800000, img: "https://via.placeholder.com/200" }
        ];

        // Khởi tạo Admin mặc định
        if (!localStorage.getItem('user_admin')) {
            localStorage.setItem('user_admin', JSON.stringify({ name: 'admin', pass: '123', balance: 0, role: 'admin' }));
        }

        function toggleModal(show) {
            document.getElementById('login-overlay').style.display = show ? 'block' : 'none';
        }

        function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if(!u || !p) return alert("Nhập đủ tài khoản/mật khẩu!");

            let data = localStorage.getItem('user_' + u);
            if(data) {
                let user = JSON.parse(data);
                if(user.pass === p) {
                    localStorage.setItem('currentSession', u);
                    location.reload(); // Đăng nhập xong load lại trang để cập nhật ví
                } else { alert("Sai mật khẩu!"); }
            } else {
                // Tự đăng ký
                let newUser = { name: u, pass: p, balance: 0, role: 'user' };
                localStorage.setItem('user_' + u, JSON.stringify(newUser));
                localStorage.setItem('currentSession', u);
                location.reload();
            }
        }

        function renderApp() {
            const currentUser = localStorage.getItem('currentSession');
            
            // Hiển thị sản phẩm
            const list = document.getElementById('product-list');
            products.forEach(p => {
                list.innerHTML += `
                    <div class="card">
                        <img src="${p.img}">
                        <h3>${p.name}</h3>
                        <p style="color:red; font-weight:bold">${p.price.toLocaleString()}đ</p>
                        <button class="btn-buy" onclick="buyProduct(${p.price}, '${p.name}')">MUA NGAY</button>
                    </div>
                `;
            });

            // Nếu đã đăng nhập thì hiện ví tiền và thanh Admin
            if(currentUser) {
                const userData = JSON.parse(localStorage.getItem('user_' + currentUser));
                document.getElementById('auth-btns').style.display = 'none';
                document.getElementById('user-bar').style.display = 'block';
                document.getElementById('u-name').innerText = currentUser.toUpperCase();
                document.getElementById('u-balance').innerText = userData.balance.toLocaleString();
                
                if(userData.role === 'admin') document.getElementById('admin-panel').style.display = 'block';
            }
        }

        function buyProduct(price, name) {
            const currentUser = localStorage.getItem('currentSession');
            if(!currentUser) return alert("Bạn phải đăng nhập mới mua được hàng!");

            let userData = JSON.parse(localStorage.getItem('user_' + currentUser));
            if(userData.balance < price) {
                alert("Bạn không đủ tiền! Hãy nhờ Admin cộng thêm nhé.");
            } else {
                userData.balance -= price;
                localStorage.setItem('user_' + currentUser, JSON.stringify(userData));
                alert("Chúc mừng! Bạn đã mua thành công: " + name);
                location.reload(); // Load lại để trừ tiền trên màn hình
            }
        }

        function adminAddMoney() {
            const target = document.getElementById('target-user').value;
            const money = parseInt(document.getElementById('amount').value);
            let data = localStorage.getItem('user_' + target);
            if(data) {
                let user = JSON.parse(data);
                user.balance += money;
                localStorage.setItem('user_' + target, JSON.stringify(user));
                alert("Đã cộng " + money + " cho " + target);
                location.reload();
            } else { alert("Không tìm thấy User này!"); }
        }

        function logout() {
            localStorage.removeItem('currentSession');
            location.reload();
        }

        renderApp();
    </script>
</body>
</html>
