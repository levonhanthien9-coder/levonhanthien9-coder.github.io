<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Aqua Store Online - Dữ Liệu Đã Lưu Trên Mây</title>
    <style>
        :root { --primary: #00a8ff; --dark: #2f3640; --gold: #fbc531; --success: #4cd137; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f6fa; margin: 0; padding-bottom: 50px; }
        nav { background: var(--dark); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .btn-auth { background: var(--primary); border: none; padding: 10px 20px; border-radius: 5px; color: white; cursor: pointer; font-weight: bold; }
        #user-info-bar { background: #dcdde1; padding: 10px 5%; display: none; text-align: right; border-bottom: 2px solid var(--primary); }
        .section-box { background: white; padding: 20px; margin: 20px 5%; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #admin-panel { background: var(--gold); display: none; }
        #history-panel { display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: var(--dark); color: white; }
        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 20px 5%; }
        .fish-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        .fish-card img { width: 100%; height: 180px; object-fit: cover; }
        .btn-buy { background: var(--dark); color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; margin-bottom: 15px; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; }
        .modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 10px; width: 350px; }
        .modal input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .status-preparing { background: #ff9f43; color: white; }
        .status-shipping { background: #0984e3; color: white; }
        .status-done { background: #4cd137; color: white; }
    </style>
</head>
<body>

    <nav>
        <div style="font-size: 24px; font-weight: bold;">🐟 AQUA STORE ONLINE</div>
        <div id="auth-buttons">
            <button class="btn-auth" onclick="openModal('login-overlay')">ĐĂNG NHẬP</button>
            <button class="btn-auth" style="background:#487eb0" onclick="openModal('register-overlay')">ĐĂNG KÝ</button>
        </div>
    </nav>

    <div id="user-info-bar">
        Chào, <b id="display-name"></b> | Ví: <b id="display-balance" style="color:red">0</b>đ 
        <button onclick="logout()">Thoát</button>
    </div>

    <!-- ADMIN PANEL -->
    <div id="admin-panel" class="section-box">
        <h3>🛠 QUẢN TRỊ VIÊN: ONLINE DATABASE</h3>
        <div style="margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #666;">
            <input type="text" id="target-user" placeholder="Tên User">
            <input type="number" id="add-amount" placeholder="Số tiền">
            <button onclick="adminAddMoney()">CỘNG TIỀN</button>
        </div>
        <h4>Tất cả đơn hàng:</h4>
        <div id="admin-order-list"></div>
    </div>

    <!-- USER HISTORY -->
    <div id="history-panel" class="section-box">
        <h3>📜 LỊCH SỬ MUA HÀNG TRÊN MÂY</h3>
        <div id="user-order-list"></div>
    </div>

    <div class="container" id="product-grid"></div>

    <!-- MODAL ĐĂNG KÝ -->
    <div class="overlay" id="register-overlay">
        <div class="modal">
            <h2>ĐĂNG KÝ ONLINE</h2>
            <input type="text" id="reg-user" placeholder="Tên tài khoản">
            <input type="password" id="reg-pass" placeholder="Mật khẩu">
            <input type="password" id="reg-confirm" placeholder="Xác nhận mật khẩu">
            <button onclick="handleRegister()" style="width:100%; padding:10px; background:var(--success); color:white; border:none; cursor:pointer;">TẠO TÀI KHOẢN</button>
            <button onclick="closeModals()" style="background:none; border:none; color:gray; cursor:pointer; margin-top:10px;">Hủy</button>
        </div>
    </div>

    <!-- MODAL ĐĂNG NHẬP -->
    <div class="overlay" id="login-overlay">
        <div class="modal">
            <h2>ĐĂNG NHẬP</h2>
            <input type="text" id="login-user" placeholder="Tên tài khoản">
            <input type="password" id="login-pass" placeholder="Mật khẩu">
            <button onclick="handleLogin()" style="width:100%; padding:10px; background:var(--primary); color:white; border:none; cursor:pointer;">VÀO CỬA HÀNG</button>
            <button onclick="closeModals()" style="background:none; border:none; color:gray; cursor:pointer; margin-top:10px;">Hủy</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getDatabase, ref, set, get, child, update, onValue } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

        // CẤU HÌNH FIREBASE CỦA BẠN
        const firebaseConfig = {
            apiKey: "AIzaSyA8Afsg5lU6hBZbhEFvjzSdS4mnoWfO-k4",
            authDomain: "shopcachaba.firebaseapp.com",
            projectId: "shopcachaba",
            storageBucket: "shopcachaba.firebasestorage.app",
            messagingSenderId: "822335531777",
            appId: "1:822335531777:web:057f0f90320e529e444900",
            measurementId: "G-L7CKV18DVJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const fishes = [
            { id: 1, name: "Cá Koi Nhật", price: 1500000, img: "https://images.unsplash.com/photo-1517361225306-73723bad67d7?w=400" },
            { id: 2, name: "Cá Rồng Huyết", price: 5000000, img: "https://images.unsplash.com/photo-1625244695851-1fc8739942b0?w=400" },
            { id: 3, name: "Cá Betta", price: 200000, img: "https://images.unsplash.com/photo-1522060290919-28f7a4a19be1?w=400" }
        ];

        window.openModal = (id) => { document.getElementById(id).style.display = 'block'; };
        window.closeModals = () => { 
            document.getElementById('register-overlay').style.display = 'none';
            document.getElementById('login-overlay').style.display = 'none';
        };

        window.handleRegister = async () => {
            const u = document.getElementById('reg-user').value;
            const p = document.getElementById('reg-pass').value;
            const c = document.getElementById('reg-confirm').value;
            if(!u || !p) return alert("Không được để trống!");
            if(p !== c) return alert("Mật khẩu xác nhận không khớp!");

            const snapshot = await get(child(ref(db), `users/${u}`));
            if (snapshot.exists()) return alert("Tên tài khoản đã tồn tại!");

            await set(ref(db, 'users/' + u), {
                name: u, pass: p, balance: 0, role: u === 'admin' ? 'admin' : 'user'
            });
            alert("Đăng ký thành công! Hãy đăng nhập.");
            closeModals();
        };

        window.handleLogin = async () => {
            const u = document.getElementById('login-user').value;
            const p = document.getElementById('login-pass').value;
            const snapshot = await get(child(ref(db), `users/${u}`));
            if (snapshot.exists()) {
                const user = snapshot.val();
                if(user.pass === p) {
                    localStorage.setItem('currentUser', u);
                    location.reload();
                } else alert("Sai mật khẩu!");
            } else alert("Tài khoản không tồn tại!");
        };

        window.buyFish = async (name, price) => {
            const cur = localStorage.getItem('currentUser');
            if(!cur) return alert("Vui lòng đăng nhập!");
            const snapshot = await get(child(ref(db), `users/${cur}`));
            const user = snapshot.val();
            if(user.balance < price) return alert("Không đủ tiền!");

            update(ref(db, 'users/' + cur), { balance: user.balance - price });
            const orderId = Date.now();
            set(ref(db, 'orders/' + orderId), {
                id: orderId, user: cur, product: name, price: price, status: 'Chờ xử lý', time: new Date().toLocaleString()
            });
            alert("Đã đặt mua cá thành công!");
        };

        window.adminAddMoney = async () => {
            const t = document.getElementById('target-user').value;
            const m = parseInt(document.getElementById('add-amount').value);
            const snapshot = await get(child(ref(db), `users/${t}`));
            if(snapshot.exists()) {
                update(ref(db, 'users/' + t), { balance: snapshot.val().balance + m });
                alert("Đã cộng tiền!");
            } else alert("Không thấy user!");
        };

        window.updateStatus = (orderId, newStatus) => {
            update(ref(db, 'orders/' + orderId), { status: newStatus });
        };

        function initApp() {
            renderProducts();
            const cur = localStorage.getItem('currentUser');
            if(!cur) return;

            onValue(ref(db, 'users/' + cur), (snapshot) => {
                const user = snapshot.val();
                if(!user) return;
                document.getElementById('auth-buttons').style.display = 'none';
                document.getElementById('user-info-bar').style.display = 'block';
                document.getElementById('display-name').innerText = cur;
                document.getElementById('display-balance').innerText = user.balance.toLocaleString();
                if(user.role === 'admin') document.getElementById('admin-panel').style.display = 'block';
            });

            onValue(ref(db, 'orders'), (snapshot) => {
                const orders = snapshot.val() || {};
                renderUserOrders(cur, orders);
                if(document.getElementById('admin-panel').style.display === 'block') {
                    renderAdminOrders(orders);
                }
            });
        }

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            fishes.forEach(f => {
                grid.innerHTML += `<div class="fish-card">
                    <img src="${f.img}"><h3>${f.name}</h3>
                    <p style="color:red; font-weight:bold">${f.price.toLocaleString()}đ</p>
                    <button class="btn-buy" onclick="buyFish('${f.name}', ${f.price})">MUA CÁ</button>
                </div>`;
            });
        }

        function renderUserOrders(username, allOrders) {
            document.getElementById('history-panel').style.display = 'block';
            let html = `<table><tr><th>Sản phẩm</th><th>Giá</th><th>Trạng thái</th></tr>`;
            const myOrders = Object.values(allOrders).filter(o => o.user === username).reverse();
            myOrders.forEach(o => {
                html += `<tr><td>${o.product}</td><td>${o.price.toLocaleString()}</td>
                <td><span class="status-badge status-${getStatusClass(o.status)}">${o.status}</span></td></tr>`;
            });
            document.getElementById('user-order-list').innerHTML = html + `</table>`;
        }

        function renderAdminOrders(allOrders) {
            let html = `<table><tr><th>Khách</th><th>Sản phẩm</th><th>Thao tác</th></tr>`;
            Object.values(allOrders).reverse().forEach(o => {
                html += `<tr><td>${o.user}</td><td>${o.product}</td>
                <td>
                    <button onclick="updateStatus(${o.id}, 'Đang chuẩn bị')">Chuẩn bị</button>
                    <button onclick="updateStatus(${o.id}, 'Đang giao')">Giao</button>
                    <button onclick="updateStatus(${o.id}, 'Đã giao')">Xong</button>
                </td></tr>`;
            });
            document.getElementById('admin-order-list').innerHTML = html + `</table>`;
        }

        function getStatusClass(s) {
            if(s === 'Đang chuẩn bị') return 'preparing';
            if(s === 'Đang giao') return 'shipping';
            if(s === 'Đã giao') return 'done';
            return '';
        }

        window.logout = () => { localStorage.removeItem('currentUser'); location.reload(); };

        initApp();
    </script>
</body>
</html>
