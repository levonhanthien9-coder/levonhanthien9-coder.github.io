<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>CÁ CẢNH STORE - Quản Lý Đơn Hàng</title>
    <style>
        :root { 
            --primary: #00a8ff; --dark: #2f3640; --gold: #fbc531; 
            --success: #4cd137; --danger: #e84118; --light: #f5f6fa;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--light); margin: 0; }
        
        /* NAVIGATION */
        nav { 
            background: var(--dark); color: white; padding: 15px 5%; 
            display: flex; justify-content: space-between; align-items: center; 
            position: sticky; top: 0; z-index: 1000;
        }
        .menu { display: flex; gap: 20px; }
        .menu a { color: white; text-decoration: none; font-weight: 500; cursor: pointer; }
        .menu a:hover { color: var(--primary); }

        /* TRẠNG THÁI NỘI DUNG */
        .page-content { display: block; } /* Phần mặc định hiện */
        .history-page { display: none; padding: 40px 5%; min-height: 80vh; } /* Phần lịch sử mặc định ẩn */

        /* BẢNG LỊCH SỬ */
        .section-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #f8f9fa; padding: 15px; text-align: left; border-bottom: 2px solid #eee; color: #666; }
        td { padding: 15px; border-bottom: 1px solid #eee; }
        
        .status-pill { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .pending { background: #fff3cd; color: #856404; }
        .done { background: #d4edda; color: #155724; }

        /* CÁC THÀNH PHẦN KHÁC */
        .hero-section { height: 300px; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1522060290919-28f7a4a19be1?w=1200'); background-size: cover; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; }
        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 20px 5%; }
        .fish-card { background: white; padding: 15px; border-radius: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .fish-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 5px; }
        .btn-buy { background: var(--primary); color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- THANH MENU (Luôn luôn hiện) -->
    <nav>
        <div style="font-size: 22px; font-weight: bold; color: var(--gold);">🐟 CÁ CẢNH STORE</div>
        <div class="menu">
            <a onclick="showPage('home')">Trang Chủ</a>
            <a onclick="showPage('history')" id="menu-history" style="display: none;">Lịch Sử Mua Hàng</a>
        </div>
        <div id="user-info" style="display: none;">
            <span id="display-name"></span> | Ví: <b id="display-balance" style="color:var(--success)">0</b>đ
            <button onclick="logout()" style="background:none; border:1px solid #666; color:white; padding:4px 8px; cursor:pointer; margin-left:10px;">Thoát</button>
        </div>
        <button id="btn-login-main" onclick="alert('Vui lòng dùng tài khoản của bạn!')" style="background:var(--primary); border:none; color:white; padding:8px 15px; border-radius:5px; cursor:pointer;">ĐĂNG NHẬP</button>
    </nav>

    <!-- PHẦN TRANG CHỦ (Sẽ bị ẩn khi bấm vào Lịch sử) -->
    <div id="home-page" class="page-content">
        <section class="hero-section">
            <h1>ĐỈNH NÓC KỊCH TRẦN</h1>
            <p>Chào mừng bạn đến với cửa hàng cá cảnh của Thiên</p>
        </section>
        
        <h2 style="text-align:center; margin-top:30px;">SẢN PHẨM MỚI NHẤT</h2>
        <div class="container" id="product-list">
            <!-- Cá sẽ hiện ở đây -->
        </div>
    </div>

    <!-- PHẦN LỊCH SỬ (Chỉ hiện khi bấm vào Lịch sử) -->
    <div id="history-page" class="history-page">
        <div class="section-box">
            <h2 style="margin-top:0; color: var(--dark);">📜 LỊCH SỬ ĐƠN HÀNG</h2>
            <p>Dưới đây là danh sách các loại cá bạn đã đặt mua:</p>
            <div id="user-order-list">
                <!-- Bảng đơn hàng hiện ở đây -->
            </div>
            <button onclick="showPage('home')" style="margin-top:20px; padding:10px 20px; cursor:pointer;">← Quay lại mua sắm</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA8Afsg5lU6hBZbhEFvjzSdS4mnoWfO-k4",
            authDomain: "shopcachaba.firebaseapp.com",
            projectId: "shopcachaba",
            storageBucket: "shopcachaba.firebasestorage.app",
            messagingSenderId: "822335531777",
            appId: "1:822335531777:web:057f0f90320e529e444900"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const cur = localStorage.getItem('currentUser');

        // HÀM CHUYỂN TRANG QUAN TRỌNG
        window.showPage = (pageName) => {
            if(pageName === 'home') {
                document.getElementById('home-page').style.display = 'block';
                document.getElementById('history-page').style.display = 'none';
            } else {
                document.getElementById('home-page').style.display = 'none';
                document.getElementById('history-page').style.display = 'block';
            }
        };

        window.logout = () => { localStorage.removeItem('currentUser'); location.reload(); };

        // Lấy dữ liệu cá
        onValue(ref(db, 'fishes'), (snap) => {
            const grid = document.getElementById('product-list');
            grid.innerHTML = '';
            for(let k in snap.val()){
                const f = snap.val()[k];
                grid.innerHTML += `<div class="fish-card">
                    <img src="${f.img}">
                    <h3>${f.name}</h3>
                    <p style="color:red; font-weight:bold">${f.price.toLocaleString()}đ</p>
                    <button class="btn-buy" onclick="alert('Chức năng mua đang bảo trì')">MUA NGAY</button>
                </div>`;
            }
        });

        // Xử lý khi đã đăng nhập
        if(cur) {
            document.getElementById('btn-login-main').style.display = 'none';
            document.getElementById('user-info').style.display = 'block';
            document.getElementById('menu-history').style.display = 'block';
            document.getElementById('display-name').innerText = cur;

            onValue(ref(db, `users/${cur}`), snap => {
                document.getElementById('display-balance').innerText = snap.val().balance.toLocaleString();
            });

            onValue(ref(db, 'orders'), snap => {
                const orders = Object.values(snap.val() || {}).reverse();
                let tableHtml = `<table><tr><th>Ngày</th><th>Tên Cá</th><th>SL</th><th>Giá</th><th>Trạng thái</th></tr>`;
                
                orders.filter(o => o.user === cur).forEach(o => {
                    const statusClass = o.status === 'Xong' ? 'done' : 'pending';
                    tableHtml += `<tr>
                        <td style="font-size:12px">${o.time}</td>
                        <td><b>${o.product}</b></td>
                        <td>${o.qty}</td>
                        <td>${o.price.toLocaleString()}đ</td>
                        <td><span class="status-pill ${statusClass}">${o.status}</span></td>
                    </tr>`;
                });
                document.getElementById('user-order-list').innerHTML = tableHtml + `</table>`;
            });
        }
    </script>
</body>
</html>
